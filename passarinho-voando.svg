<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3ff"/>
      <stop offset="100%" stop-color="#eaf7ff"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#2f6ab0"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6fb1ec"/>
      <stop offset="100%" stop-color="#3a7bc8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="680" cy="90" r="45" fill="#fff3b0" opacity="0.9"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="120" cy="90" rx="55" ry="22"/>
    <ellipse cx="165" cy="80" rx="40" ry="18"/>
    <ellipse cx="90" cy="75" rx="35" ry="16"/>

    <ellipse cx="600" cy="260" rx="45" ry="18"/>
    <ellipse cx="640" cy="250" rx="30" ry="14"/>

    <ellipse cx="250" cy="400" rx="60" ry="20"/>
    <ellipse cx="300" cy="410" rx="40" ry="16"/>
  </g>

  <!-- small distant birds -->
  <g stroke="#5a6b7a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M540 150 q10 -12 20 0 q10 -12 20 0"/>
    <path d="M480 190 q8 -10 16 0 q8 -10 16 0"/>
  </g>

  <!-- Main bird flying, centered -->
  <g transform="translate(400 250) rotate(-8)">

    <!-- back wing (upstroke) -->
    <path d="M -10 0
             C -90 -100, -170 -90, -210 -20
             C -160 -30, -100 -20, -40 20
             Z"
          fill="url(#wingGrad)" opacity="0.9"/>

    <!-- tail -->
    <path d="M -40 10
             C -90 20, -120 45, -140 70
             C -110 55, -75 45, -30 35
             Z"
          fill="url(#bodyGrad)"/>

    <!-- body -->
    <ellipse cx="10" cy="10" rx="70" ry="34" fill="url(#bodyGrad)"/>

    <!-- belly -->
    <ellipse cx="15" cy="26" rx="45" ry="16" fill="#f2f6fa" opacity="0.9"/>

    <!-- head -->
    <circle cx="75" cy="-10" r="30" fill="url(#bodyGrad)"/>

    <!-- beak -->
    <path d="M 100 -12 L 128 -4 L 100 4 Z" fill="#f3a53d"/>

    <!-- eye -->
    <circle cx="86" cy="-16" r="4.5" fill="#12202b"/>
    <circle cx="87.5" cy="-17.5" r="1.4" fill="#ffffff"/>

    <!-- front wing (downstroke) -->
    <path d="M 0 5
             C -60 60, -150 60, -220 10
             C -150 5, -70 -5, -10 -15
             Z"
          fill="url(#wingGrad)"/>

    <!-- wing feather details -->
    <g stroke="#2b5f9e" stroke-width="2" opacity="0.5" fill="none">
      <path d="M -60 15 C -100 35, -150 35, -190 15"/>
      <path d="M -40 -2 C -90 -25, -140 -30, -180 -15"/>
    </g>
  </g>
</svg>
